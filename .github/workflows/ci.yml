name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # Lets a run be started by hand from the Actions tab. Worth having for its own
  # sake, and the only way to re-run CI on a pull request whose checks never
  # got created in the first place.
  workflow_dispatch:

jobs:
  verify:
    name: typecheck / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next generates the route/layout types (LayoutProps, PageProps, …) that
      # the app's own signatures refer to. They do not exist in a fresh clone,
      # so tsc has to come after this, not before it.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  no-dev-surface:
    # The name predates the build-time flag and is kept because branch
    # protection requires it. main and dev now carry the same source; what must
    # never ship is the dev tools in a production bundle, so that is what this
    # checks, on every branch (lib/devTools.d.ts, scripts/check-dev-tools.mjs).
    name: no dev surface on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with dev tools, and check the markers are there to find
        run: |
          RUYAH_DEV_TOOLS=1 npm run build
          node scripts/check-dev-tools.mjs present
      - name: Build without them, and check none reached the bundle
        run: |
          rm -rf out
          npm run build
          node scripts/check-dev-tools.mjs absent
